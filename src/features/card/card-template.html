<template id="card-template">
  <div class="card">
    <div class="card__content">
      <div class="card__header">
        <h2 class="card__category text text--medium text--secondary"></h2>
        <button
          type="button"
          class="icon icon--medium button"
          aria-label="more options"
        >
          <svg
            class="icon icon--small"
            viewBox="0 0 21 5"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M2.5 0a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Zm8 0a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Zm8 0a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Z"
              fill="currentColor"
              fill-rule="evenodd"
            />
          </svg>
        </button>
      </div>
      <img class="card__image" src="../assets/images/menu/default.jpg" alt="" />
      <div class="card__text-content">
        <p class="card__name text text--medium text--light text--secondary"></p>
        <p
          class="card__footer text text--small text--secondary text--uppercase text--regular text--regular"
        >
          <span class="card__rating"></span><span class="card__price"></span>
        </p>
      </div>
    </div>
  </div>
</template>

</div>
